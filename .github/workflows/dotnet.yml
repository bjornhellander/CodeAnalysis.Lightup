# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
        matrix:
            configuration: [ "Debug", "Release" ]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 11.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build -c ${{matrix.configuration}} --no-restore
    - name: Collect type info
      run: dotnet run -c ${{matrix.configuration}} --no-build --project src/CodeAnalysis.Lightup.Collector
    - name: Build again
      run: dotnet build -c ${{matrix.configuration}} --no-restore
    - name: Check that generated files did not change
      shell: bash
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "Build produced changes. Please run the build locally and commit the results."
          git status --untracked-files=all
          exit 1
        fi
    - name: Test
      run: dotnet test -c ${{matrix.configuration}} --no-build --verbosity normal --collect:"XPlat Code Coverage" --settings runsettings.xml
    - name: Upload coverage
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}